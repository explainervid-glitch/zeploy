<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>zeploy test panel</title>
  <style>
    body { margin: 0; padding: 16px; background: #232323; color: #ddd; font: 13px sans-serif; }
    button { margin-top: 8px; padding: 4px 10px; background: #3a3a3a; color: #ddd; border: 1px solid #555; border-radius: 3px; cursor: pointer; }
    button:hover { background: #4a4a4a; }
    .muted { color: #999; font-size: 12px; }
  </style>
  <!-- zeploy's usage helper, as every plugin includes it (examples/usage). -->
  <script src="zeploy-usage.js"></script>
</head>
<body>
  <p>zeploy test panel 1.2.0 is installed. It does nothing else.</p>
  <button type="button" id="try">Try a feature</button>
  <p id="count" class="muted"></p>
  <p class="muted">Opening this panel and the button are reported to zeploy, under Usage in the admin app, within a minute.</p>
  <script>
    var usage = zeployUsageV1("com.zeploy.testpanel", "1.2.0", "aftereffects");
    usage.open();
    var tries = 0;
    document.getElementById("try").addEventListener("click", function () {
      usage.track("try", function () {
        tries++;
        document.getElementById("count").textContent = "Tried " + tries + (tries === 1 ? " time" : " times") + ".";
      });
    });
  </script>
</body>
</html>
